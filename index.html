          href="https://ginho83-wq.github.io/obra_livre/"

  <script>
    const serviceWorkerVersion = "351593171" /* Flutter's service worker is deprecated and will be removed in a future Flutter release. */;
  </script>

  <script
          src="flutter.js"
          defer
  ></script>
</head>

<body>

<script>
  window.addEventListener('load', function () {
    _flutter.loader.loadEntrypoint({
      serviceWorker: {
        serviceWorkerVersion: serviceWorkerVersion,
      },

      onEntrypointLoaded: function (engineInitializer) {
        engineInitializer
          .initializeEngine()
          .then(function (appRunner) {
            appRunner.runApp();
          });
      }
    });
  });
</script>

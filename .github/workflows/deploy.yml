name: Deploy Flutter Web para GitHub Pages

on:
  push:
    branches:
      - main

  workflow_dispatch:

  schedule:
    - cron: '0 2 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:

      # ==========================================================
      # 1. BAIXAR CÓDIGO
      # ==========================================================
      - name: Baixar código
        uses: actions/checkout@v4

      # ==========================================================
      # 2. CONFIGURAR FLUTTER
      # ==========================================================
      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      # ==========================================================
      # 3. CONFIGURAR NODE.JS
      # ==========================================================
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # ==========================================================
      # 4. INSTALAR DEPENDÊNCIAS
      # ==========================================================
      - name: Instalar dependências
        run: flutter pub get

      # ==========================================================
      # 5. VERIFICAR SECRETS DO SUPABASE
      # ==========================================================
      - name: Verificar configuração do Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}

        run: |
          set -e

          echo "Verificando configuração do Supabase..."

          if [ -z "$SUPABASE_URL" ]; then
            echo "ERRO: SUPABASE_URL não está configurada."
            exit 1
          fi

          if [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "ERRO: SUPABASE_ANON_KEY não está configurada."
            exit 1
          fi

          echo "SUPABASE_URL configurada."
          echo "SUPABASE_ANON_KEY configurada."

      # ==========================================================
      # 6. TESTAR CONEXÃO COM SUPABASE
      # ==========================================================
      - name: Testar conexão com Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}

        run: |
          set -e

          SUPABASE_URL="${SUPABASE_URL%/}"

          echo "Testando API REST do Supabase..."

          HTTP_STATUS=$(curl \
            --silent \
            --output resposta_supabase.json \
            --write-out "%{http_code}" \
            --request GET \
            --header "apikey: ${SUPABASE_ANON_KEY}" \
            --header "Authorization: Bearer ${SUPABASE_ANON_KEY}" \
            --header "Content-Type: application/json" \
            --header "Accept: application/json" \
            "${SUPABASE_URL}/rest/v1/obras?select=id&status=eq.aprovada&limit=1")

          echo "Código HTTP recebido: ${HTTP_STATUS}"

          if [ "$HTTP_STATUS" != "200" ]; then
            echo "ERRO: Supabase respondeu com HTTP ${HTTP_STATUS}."
            echo "Resposta do Supabase:"
            cat resposta_supabase.json
            exit 1
          fi

          echo "API do Supabase respondeu corretamente."
          cat resposta_supabase.json

      # ==========================================================
      # 7. VERIFICAR SE O GERADOR SEO EXISTE
      # ==========================================================
      - name: Verificar arquivo gerador SEO
        run: |
          set -e

          echo "=============================================="
          echo "VERIFICANDO ARQUIVO SEO"
          echo "=============================================="

          echo ""
          echo "Diretório atual:"
          pwd

          echo ""
          echo "Conteúdo da raiz:"
          ls -la

          echo ""
          echo "Conteúdo da pasta scripts:"

          if [ ! -d "scripts" ]; then
            echo "ERRO: A pasta scripts não existe."
            exit 1
          fi

          ls -la scripts

          echo ""
          echo "Verificando:"
          echo "scripts/generate_seo_pages.js"

          if [ ! -f "scripts/generate_seo_pages.js" ]; then
            echo ""
            echo "ERRO: O arquivo scripts/generate_seo_pages.js não foi encontrado."
            echo ""

            echo "Arquivos JavaScript encontrados:"
            find . -name "*.js" -type f | sort

            exit 1
          fi

          echo ""
          echo "Arquivo scripts/generate_seo_pages.js encontrado com sucesso."

      # ==========================================================
      # 8. CONSTRUIR APLICAÇÃO FLUTTER WEB
      # ==========================================================
      - name: Construir aplicação Flutter Web
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}

        run: |
          set -e

          echo "Construindo aplicação Flutter Web..."

          flutter build web --release \
            --base-href "/obra_livre/" \
            --dart-define="SUPABASE_URL=$SUPABASE_URL" \
            --dart-define="SUPABASE_ANON_KEY=$SUPABASE_ANON_KEY"

          echo ""
          echo "Build Flutter concluído."

      # ==========================================================
      # 9. VERIFICAR BUILD
      # ==========================================================
      - name: Verificar build Flutter
        run: |
          set -e

          if [ ! -f "build/web/index.html" ]; then
            echo "ERRO: build/web/index.html não foi encontrado."
            exit 1
          fi

          echo "build/web/index.html encontrado."

      # ==========================================================
      # 10. GERAR PÁGINAS SEO INDIVIDUAIS
      # ==========================================================
      - name: Gerar páginas SEO das obras
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}

        run: |
          set -e

          echo "=============================================="
          echo "GERANDO PÁGINAS SEO INDIVIDUAIS"
          echo "=============================================="

          node scripts/generate_seo_pages.js

          echo ""
          echo "Páginas SEO geradas com sucesso."

      # ==========================================================
      # 11. CRIAR FALLBACK 404
      # ==========================================================
      - name: Criar fallback 404
        run: |
          set -e

          cp build/web/index.html build/web/404.html

          echo "404.html criado com sucesso."

      # ==========================================================
      # 12. VERIFICAR ARQUIVOS SEO FINAIS
      # ==========================================================
      - name: Verificar arquivos SEO finais
        run: |
          set -e

          echo "=============================================="
          echo "VERIFICAÇÃO FINAL SEO"
          echo "=============================================="

          # Sitemap
          if [ ! -f "build/web/sitemap.xml" ]; then
            echo "ERRO: sitemap.xml não foi criado."
            exit 1
          fi

          echo "✓ sitemap.xml encontrado."

          # Robots
          if [ ! -f "build/web/robots.txt" ]; then
            echo "ERRO: robots.txt não foi criado."
            exit 1
          fi

          echo "✓ robots.txt encontrado."

          # Quantidade de URLs individuais
          echo ""
          echo "Quantidade de URLs individuais no sitemap:"

          grep -c "/obra/" build/web/sitemap.xml || true

          # Quantidade de páginas individuais
          echo ""
          echo "Quantidade de páginas HTML individuais:"

          find build/web/obra \
            -type f \
            -name "index.html" \
            2>/dev/null | wc -l || true

          echo ""

          echo "Arquivos SEO:"

          ls -lh build/web/sitemap.xml
          ls -lh build/web/robots.txt

          echo ""

          echo "Primeiras URLs individuais encontradas:"

          grep "/obra/" build/web/sitemap.xml | head -10 || true

      # ==========================================================
      # 13. CONFIGURAR GITHUB PAGES
      # ==========================================================
      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      # ==========================================================
      # 14. CRIAR ARTEFATO DO GITHUB PAGES
      # ==========================================================
      - name: Preparar artefato do GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./build/web

      # ==========================================================
      # 15. PUBLICAR NO GITHUB PAGES
      # ==========================================================
      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4


name: Deploy Flutter Web para GitHub Pages

on:
  push:
    branches:
      - main

  workflow_dispatch:

  schedule:
    - cron: '0 2 * * *'

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:

      # ==========================================================
      # 1. BAIXAR CÓDIGO
      # ==========================================================

      - name: Baixar código
        uses: actions/checkout@v4


      # ==========================================================
      # 2. CONFIGURAR FLUTTER
      # ==========================================================

      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable


      # ==========================================================
      # 3. INSTALAR DEPENDÊNCIAS
      # ==========================================================

      - name: Instalar dependências
        run: flutter pub get


      # ==========================================================
      # 4. VERIFICAR SE OS SECRETS EXISTEM
      # ==========================================================

      - name: Verificar configuração do Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}

        run: |
          set -e

          echo "Verificando configuração do Supabase..."

          if [ -z "$SUPABASE_URL" ]; then
            echo "ERRO: SUPABASE_URL não está configurada."
            exit 1
          fi

          if [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "ERRO: SUPABASE_ANON_KEY não está configurada."
            exit 1
          fi

          echo "SUPABASE_URL configurada."
          echo "SUPABASE_ANON_KEY configurada."


      # ==========================================================
      # 5. TESTAR API DO SUPABASE
      # ==========================================================

      - name: Testar conexão com Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}

        run: |
          set -e

          SUPABASE_URL="${SUPABASE_URL%/}"

          echo "Testando API REST do Supabase..."

          HTTP_STATUS=$(curl \
            --silent \
            --output resposta_supabase.json \
            --write-out "%{http_code}" \
            --request GET \
            --header "apikey: ${SUPABASE_ANON_KEY}" \
            --header "Authorization: Bearer ${SUPABASE_ANON_KEY}" \
            --header "Content-Type: application/json" \
            --header "Accept: application/json" \
            "${SUPABASE_URL}/rest/v1/obras?select=id&limit=1")

          echo "Código HTTP recebido: ${HTTP_STATUS}"

          if [ "$HTTP_STATUS" != "200" ]; then
            echo "ERRO: Supabase respondeu com HTTP ${HTTP_STATUS}."
            echo "Resposta do Supabase:"
            cat resposta_supabase.json
            exit 1
          fi

          echo "API do Supabase respondeu corretamente."

          cat resposta_supabase.json


      # ==========================================================
      # 6. GERAR SITEMAP COM OBRAS APROVADAS
      # ==========================================================

      - name: Gerar sitemap com obras publicadas
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}

        run: |
          set -e

          SUPABASE_URL="${SUPABASE_URL%/}"

          echo "Consultando obras aprovadas no Supabase..."

          curl \
            --fail \
            --silent \
            --show-error \
            --request GET \
            --header "apikey: ${SUPABASE_ANON_KEY}" \
            --header "Authorization: Bearer ${SUPABASE_ANON_KEY}" \
            --header "Content-Type: application/json" \
            --header "Accept: application/json" \
            "${SUPABASE_URL}/rest/v1/obras?select=id,data_publicacao&status=eq.aprovada&order=data_publicacao.desc" \
            --output obras_publicadas.json

          echo "Consulta concluída."

          python3 - <<'PY'
          import json
          from datetime import datetime, timezone
          from xml.sax.saxutils import escape

          BASE_URL = "https://ginho83-wq.github.io/obra_livre"

          # ======================================================
          # LER OBRAS
          # ======================================================

          with open(
              "obras_publicadas.json",
              "r",
              encoding="utf-8"
          ) as arquivo:
              obras = json.load(arquivo)

          hoje = datetime.now(
              timezone.utc
          ).date().isoformat()

          # ======================================================
          # PÁGINAS PRINCIPAIS
          # ======================================================

          urls = [
              (
                  f"{BASE_URL}/",
                  hoje,
                  "weekly",
                  "1.0"
              ),
              (
                  f"{BASE_URL}/acervo",
                  hoje,
                  "weekly",
                  "0.9"
              ),
              (
                  f"{BASE_URL}/categoria/doutoramento",
                  hoje,
                  "monthly",
                  "0.7"
              ),
              (
                  f"{BASE_URL}/categoria/mestrado",
                  hoje,
                  "monthly",
                  "0.7"
              ),
              (
                  f"{BASE_URL}/categoria/monografia",
                  hoje,
                  "monthly",
                  "0.7"
              ),
              (
                  f"{BASE_URL}/categoria/artigos",
                  hoje,
                  "monthly",
                  "0.7"
              ),
              (
                  f"{BASE_URL}/categoria/literatura",
                  hoje,
                  "monthly",
                  "0.7"
              ),
          ]

          # ======================================================
          # ADICIONAR CADA OBRA APROVADA
          # ======================================================

          for obra in obras:
              obra_id = str(
                  obra.get("id", "")
              ).strip()

              if not obra_id:
                  continue

              data_publicacao = obra.get(
                  "data_publicacao"
              )

              if data_publicacao:
                  lastmod = str(
                      data_publicacao
                  )[:10]
              else:
                  lastmod = hoje

              urls.append(
                  (
                      f"{BASE_URL}/obra/{obra_id}",
                      lastmod,
                      "monthly",
                      "0.8"
                  )
              )

          # ======================================================
          # CRIAR SITEMAP
          # ======================================================

          with open(
              "web/sitemap.xml",
              "w",
              encoding="utf-8"
          ) as sitemap:

              sitemap.write(
                  '<?xml version="1.0" encoding="UTF-8"?>\n'
              )

              sitemap.write(
                  '<urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">\n'
              )

              for (
                  loc,
                  lastmod,
                  changefreq,
                  priority
              ) in urls:

                  sitemap.write("  <url>\n")

                  sitemap.write(
                      f"    <loc>{escape(loc)}</loc>\n"
                  )

                  sitemap.write(
                      f"    <lastmod>{escape(lastmod)}</lastmod>\n"
                  )

                  sitemap.write(
                      f"    <changefreq>{changefreq}</changefreq>\n"
                  )

                  sitemap.write(
                      f"    <priority>{priority}</priority>\n"
                  )

                  sitemap.write("  </url>\n")

              sitemap.write("</urlset>\n")

          print(
              f"Sitemap criado com {len(obras)} obras aprovadas."
          )

          PY


      # ==========================================================
      # 7. CONSTRUIR FLUTTER WEB
      # ==========================================================

      - name: Construir aplicação Flutter Web
        run: |
          flutter build web --release \
            --base-href "/obra_livre/" \
            --dart-define=SUPABASE_URL="${{ secrets.SUPABASE_URL }}" \
            --dart-define=SUPABASE_ANON_KEY="${{ secrets.SUPABASE_ANON_KEY }}"


      # ==========================================================
      # 8. VERIFICAR SITEMAP FINAL
      # ==========================================================

      - name: Verificar sitemap final
        run: |
          set -e

          test -f build/web/sitemap.xml

          echo "Sitemap encontrado."

          echo "Quantidade de URLs individuais de obras:"

          grep -c "/obra/" build/web/sitemap.xml || true

          echo "Sitemap final:"

          cat build/web/sitemap.xml


      # ==========================================================
      # 9. PUBLICAR NO GITHUB PAGES
      # ==========================================================

      - name: Publicar no GitHub Pages
        uses: peaceiris/actions-gh-pages@v4

        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build/web

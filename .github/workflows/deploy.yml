name: Deploy Flutter Web para GitHub Pages

on:
  push:
    branches:
      - main

  workflow_dispatch:

  schedule:
    - cron: '0 2 * * *'

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # ==========================================================
      # 1. BAIXAR CÓDIGO
      # ==========================================================
      - name: Baixar código
        uses: actions/checkout@v4

      # ==========================================================
      # 2. CONFIGURAR FLUTTER
      # ==========================================================
      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      # ==========================================================
      # 3. CONFIGURAR NODE.JS
      # ==========================================================
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # ==========================================================
      # 4. INSTALAR DEPENDÊNCIAS
      # ==========================================================
      - name: Instalar dependências
        run: flutter pub get

      # ==========================================================
      # 5. VERIFICAR SECRETS DO SUPABASE
      # ==========================================================
      - name: Verificar configuração do Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          set -e

          echo "Verificando configuração do Supabase..."

          if [ -z "$SUPABASE_URL" ]; then
            echo "ERRO: SUPABASE_URL não está configurada."
            exit 1
          fi

          if [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "ERRO: SUPABASE_ANON_KEY não está configurada."
            exit 1
          fi

          echo "SUPABASE_URL configurada."
          echo "SUPABASE_ANON_KEY configurada."

      # ==========================================================
      # 6. TESTAR CONEXÃO COM SUPABASE
      # ==========================================================
      - name: Testar conexão com Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          set -e

          SUPABASE_URL="${SUPABASE_URL%/}"

          echo "Testando API REST do Supabase..."

          HTTP_STATUS=$(curl \
            --silent \
            --output resposta_supabase.json \
            --write-out "%{http_code}" \
            --request GET \
            --header "apikey: ${SUPABASE_ANON_KEY}" \
            --header "Authorization: Bearer ${SUPABASE_ANON_KEY}" \
            --header "Content-Type: application/json" \
            --header "Accept: application/json" \
            "${SUPABASE_URL}/rest/v1/obras?select=id&status=eq.aprovada&limit=1")

          echo "Código HTTP recebido: ${HTTP_STATUS}"

          if [ "$HTTP_STATUS" != "200" ]; then
            echo "ERRO: Supabase respondeu com HTTP ${HTTP_STATUS}."
            cat resposta_supabase.json
            exit 1
          fi

          echo "API do Supabase respondeu corretamente."
          cat resposta_supabase.json

      # ==========================================================
      # 7. BUILD FLUTTER WEB
      # ==========================================================
      - name: Construir aplicação Flutter Web
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          set -e

          echo "Construindo aplicação Flutter Web..."

          flutter build web --release \
            --base-href "/obra_livre/" \
            --dart-define="SUPABASE_URL=$SUPABASE_URL" \
            --dart-define="SUPABASE_ANON_KEY=$SUPABASE_ANON_KEY"

          echo "Build Flutter concluído."

      # ==========================================================
      # 8. GERAR PÁGINAS SEO INDIVIDUAIS
      # ==========================================================
      - name: Gerar páginas SEO das obras
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          set -e

          echo "Gerando páginas SEO individuais..."

          node scripts/generate_seo_pages.js

          echo "Páginas SEO geradas."

      # ==========================================================
      # 9. CRIAR 404 PARA FALLBACK DO FLUTTER
      # ==========================================================
      - name: Criar fallback 404
        run: |
          set -e

          cp build/web/index.html build/web/404.html

          echo "404.html criado."

      # ==========================================================
      # 10. VERIFICAR ARQUIVOS SEO
      # ==========================================================
      - name: Verificar arquivos SEO
        run: |
          set -e

          test -f build/web/sitemap.xml
          test -f build/web/robots.txt

          echo "sitemap.xml encontrado."
          echo "robots.txt encontrado."

          echo ""
          echo "Quantidade de URLs individuais no sitemap:"
          grep -c "/obra/" build/web/sitemap.xml || true

          echo ""
          echo "Quantidade de páginas HTML individuais:"
          find build/web/obra -name "index.html" 2>/dev/null | wc -l || true

          echo ""
          echo "Arquivos principais:"
          ls -lh build/web/sitemap.xml
          ls -lh build/web/robots.txt

      # ==========================================================
      # 11. PUBLICAR NO GITHUB PAGES
      # ==========================================================
      - name: Publicar no GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build/web
